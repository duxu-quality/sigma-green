<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#34d399"/>
      <stop offset="50%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
    <linearGradient id="ring" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.25)"/>
      <stop offset="100%" style="stop-color:rgba(255,255,255,0.05)"/>
    </linearGradient>
  </defs>

  <!-- Rounded background -->
  <rect width="512" height="512" rx="120" fill="url(#bg)"/>

  <!-- Subtle grid dots -->
  <g fill="rgba(255,255,255,0.06)">
    <circle cx="128" cy="128" r="4"/><circle cx="256" cy="128" r="4"/><circle cx="384" cy="128" r="4"/>
    <circle cx="128" cy="256" r="4"/><circle cx="256" cy="256" r="4"/><circle cx="384" cy="256" r="4"/>
    <circle cx="128" cy="384" r="4"/><circle cx="256" cy="384" r="4"/><circle cx="384" cy="384" r="4"/>
  </g>

  <!-- Outer ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#ring)" stroke-width="36"/>

  <!-- Inner dashed ring -->
  <circle cx="256" cy="256" r="145" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="3" stroke-dasharray="10 14"/>

  <!-- Sigma symbol -->
  <text x="256" y="346" text-anchor="middle" font-size="280" font-weight="bold" fill="white" font-family="Georgia, 'Times New Roman', serif" letter-spacing="0">σ</text>
</svg>
