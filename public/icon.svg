<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="sigma" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="240" fill="none" stroke="url(#ring)" stroke-width="2"/>

  <!-- Outer ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.15" stroke-dasharray="8 4"/>

  <!-- Sigma symbol -->
  <text x="256" y="290" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="240" font-style="italic" fill="url(#sigma)" font-weight="bold">σ</text>

  <!-- Subtle highlight arc -->
  <path d="M 120 200 Q 256 100 392 200" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.2"/>

  <!-- Small dot accents -->
  <circle cx="168" cy="168" r="4" fill="#38bdf8" opacity="0.5"/>
  <circle cx="344" cy="168" r="3" fill="#22d3ee" opacity="0.4"/>
  <circle cx="256" cy="128" r="3.5" fill="#38bdf8" opacity="0.3"/>
</svg>
